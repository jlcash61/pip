<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PIP Playground v1.2.10</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="header">
    <h2 id="title">PIP Playground</h2>
    <div id="profileInfo" style="display:none;">
      <img id="profilePic" src="" alt="Profile Picture">
      <div id="profileName"></div>
    </div>
  </div>

  <div id="mainContent">
    <div id="threadPanel">
      <h3>My Threads</h3>
      <div id="threadList"></div> <!-- Threads will appear here -->
      <button id="newThreadBtn">+ New Thread</button>
    </div>

    <div id="chatPanel">
      <div id="conversation"></div>
      <div id="inputArea">
        <input id="userInput" placeholder="Type here..." />
        <button id="sendButton">Send</button>
        <button id="loginBtn">Login with Google</button>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>
  </div>

  <footer>BorgworX by TiBorg V1.2.10</footer>

  <script type="module" src="util.js"></script>
  <script type="module" src="main.js?v=1.2.10"></script>
</body>

</html>
